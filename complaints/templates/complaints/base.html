<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Public Complaint Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1628;
            --navy-mid: #122040;
            --accent: #2563eb;
            --accent-light: #3b82f6;
            --gold: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(10,22,40,0.10);
            --shadow-lg: 0 8px 40px rgba(10,22,40,0.18);
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface-2);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
        }

        /* ── NAVBAR ── */
        .navbar-main {
            background: var(--navy);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.25);
        }

        .navbar-brand-text {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            color: #fff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            background: rgba(255,255,255,0.12);
        }

        .nav-links .logout-link a {
            color: #fca5a5;
        }

        .nav-links .logout-link a:hover {
            background: rgba(239,68,68,0.18);
            color: #fca5a5;
        }

        /* Mobile hamburger */
        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        @media (max-width: 768px) {
            .nav-toggle { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                background: var(--navy-mid);
                padding: 12px;
                gap: 2px;
                box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            }
            .nav-links.open { display: flex; }
            .nav-links a { padding: 10px 16px; border-radius: 8px; font-size: 0.95rem; }
            .navbar-brand-text span { display: none; }
        }

        /* ── CARDS / FORM CONTAINERS ── */
        .form-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2.5rem;
            border: 1px solid var(--border);
        }

        @media (max-width: 576px) {
            .form-card { padding: 1.5rem 1.25rem; }
        }

        .form-card h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--navy);
            margin-bottom: 0.25rem;
        }

        .form-card .subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
        }

        /* ── FORM INPUTS ── */
        .form-label {
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: var(--surface-2);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
            background: #fff;
            outline: none;
        }

        textarea.form-control { min-height: 110px; resize: vertical; }

        /* ── BUTTONS ── */
        .btn-primary-custom {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.5rem;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary-custom:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-primary-custom:active { transform: translateY(0); }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 1.25rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.05); }

        /* ── STATUS BADGES ── */
        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .badge-submitted { background: #dbeafe; color: #1d4ed8; }
        .badge-progress  { background: #fef3c7; color: #b45309; }
        .badge-resolved  { background: #d1fae5; color: #065f46; }

        /* ── ALERTS ── */
        .alert-custom {
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .alert-success-custom { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
        .alert-danger-custom  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        /* ── PAGE WRAPPER ── */
        .page-wrapper {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .page-wrapper .inner {
            width: 100%;
            max-width: 520px;
        }

        /* ── BG HERO ── */
        .hero-bg {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 60%, #1e3a5f 100%);
            position: relative;
            overflow: hidden;
        }

        .hero-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://thumbs.dreamstime.com/b/skyscrapers-hyderabad-india-august-fifth-largest-contributor-city-to-india-s-gdp-us-billion-august-india-48811585.jpg') center/cover no-repeat;
            opacity: 0.18;
        }

        .hero-bg > * { position: relative; }

        /* ── TABLE ── */
        .table-custom { width: 100%; border-collapse: collapse; }
        .table-custom th {
            background: var(--navy);
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 12px 16px;
            text-align: left;
            white-space: nowrap;
        }
        .table-custom td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
            vertical-align: middle;
        }
        .table-custom tr:last-child td { border-bottom: none; }
        .table-custom tr:hover td { background: #f1f5f9; }
        .table-wrapper {
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .btn-sm-action {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.18s;
            border: none;
            cursor: pointer;
        }

        .btn-edit   { background: #dbeafe; color: #1d4ed8; }
        .btn-edit:hover { background: #bfdbfe; color: #1d4ed8; }
        .btn-delete { background: #fee2e2; color: #991b1b; }
        .btn-delete:hover { background: #fecaca; color: #991b1b; }
        .btn-update { background: #d1fae5; color: #065f46; }
        .btn-update:hover { background: #a7f3d0; color: #065f46; }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>

<nav class="navbar-main" style="position: sticky;">
    <a href="{% url 'home' %}" class="navbar-brand-text">
        <div class="brand-icon"><i class="bi bi-megaphone-fill text-white"></i></div>
        <span>Public Complaint Management</span>
    </a>

    <button class="nav-toggle" onclick="toggleNav()" aria-label="Toggle navigation">
        <i class="bi bi-list" id="nav-icon"></i>
    </button>

    <ul class="nav-links" id="navLinks">
        <li><a href="{% url 'home' %}"><i class="bi bi-house"></i> Home</a></li>
        {% if user.is_authenticated %}
        <li><a href="{% url 'add_complaint' %}"><i class="bi bi-plus-circle"></i> Add Complaint</a></li>
        <li><a href="{% url 'view_complaint' %}"><i class="bi bi-list-ul"></i> View Complaints</a></li>
        <li class="logout-link"><a href="{% url 'logout' %}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
        {% else %}
        <li><a href="{% url 'login_view' %}"><i class="bi bi-person"></i> Login</a></li>
        <li><a href="{% url 'register' %}"><i class="bi bi-person-plus"></i> Register</a></li>
        {% endif %}
    </ul>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleNav() {
        const nav = document.getElementById('navLinks');
        const icon = document.getElementById('nav-icon');
        nav.classList.toggle('open');
        icon.className = nav.classList.contains('open') ? 'bi bi-x-lg' : 'bi bi-list';
    }
    // Close on outside click
    document.addEventListener('click', function(e) {
        const nav = document.getElementById('navLinks');
        const toggle = document.querySelector('.nav-toggle');
        if (!nav.contains(e.target) && !toggle.contains(e.target)) {
            nav.classList.remove('open');
            document.getElementById('nav-icon').className = 'bi bi-list';
        }
    });
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
