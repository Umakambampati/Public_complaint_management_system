{% extends 'complaints/base.html' %}
{% block title %}Edit Complaint — Public Complaint Management{% endblock %}

{% block content %}
<div class="page-wrapper" style="align-items:flex-start;">
    <div class="inner" style="max-width:560px;">

        <div style="margin-bottom:1.5rem;">
            <a href="{% url 'view_complaint' %}" class="btn-ghost" style="font-size:0.8rem;padding:5px 12px;margin-bottom:1rem;display:inline-flex;">
                <i class="bi bi-arrow-left"></i> Back to Complaints
            </a>
            <h1 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.55rem;color:var(--navy);margin:0 0 0.25rem;">Edit Complaint</h1>
            <p style="color:var(--text-muted);font-size:0.875rem;margin:0;">Update the details of your complaint below.</p>
        </div>

        <div class="form-card">
            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Complaint Title</label>
                    <input type="text" name="title" class="form-control" value="{{ data.title }}" placeholder="Complaint title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" placeholder="Describe the issue...">{{ data.description }}</textarea>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label class="form-label">Category</label>
                        <div style="position:relative;">
                            <i class="bi bi-tag" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem;"></i>
                            <input type="text" name="category" class="form-control" style="padding-left:2.25rem;" value="{{ data.category }}" required>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label">Location</label>
                        <div style="position:relative;">
                            <i class="bi bi-geo-alt" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.9rem;"></i>
                            <input type="text" name="location" class="form-control" style="padding-left:2.25rem;" value="{{ data.location }}" required>
                        </div>
                    </div>
                </div>

                <div style="display:flex;gap:12px;flex-wrap:wrap;">
                    <button type="submit" class="btn-primary-custom" style="flex:1;justify-content:center;min-width:140px;">
                        <i class="bi bi-check-lg"></i> Save Changes
                    </button>
                    <a href="{% url 'view_complaint' %}" class="btn-ghost" style="flex:1;justify-content:center;min-width:120px;">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
